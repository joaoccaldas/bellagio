name: Deploy Caldas Worlds

on:
  push:
    branches: [main]
    paths-ignore:
      - 'worlds/vegas/index.html'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: caldas-worlds-pages
  cancel-in-progress: true

jobs:
  validate-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Checkout canonical Kona world
        uses: actions/checkout@v4
        with:
          repository: joaoccaldas/studio-kona
          path: _vendor/studio-kona

      - name: Checkout pinned final KONA room recovery
        uses: actions/checkout@v4
        with:
          repository: joaoccaldas/konam
          ref: 363848cb1c311ad88d48eebbde160c518a34dc30
          path: _vendor/konam-final

      - name: Validate world contracts
        run: |
          test -f deployment.yaml
          test -f worlds/world.schema.json
          test -f worlds/vegas/world.json
          test -f worlds/registry.json
          test -f portal/index.html
          python -m json.tool worlds/world.schema.json >/dev/null
          python -m json.tool worlds/vegas/world.json >/dev/null
          python -m json.tool worlds/registry.json >/dev/null

      - name: Reject localhost references
        run: |
          if grep -R -nE 'https?://(127\.0\.0\.1|localhost)' portal worlds deployment.yaml web/src web/index.template.html; then
            echo "Localhost reference found in deployable world"
            exit 1
          fi

      - name: Guard Bellagio startup selectors
        run: |
          python - <<'PY'
          from pathlib import Path
          src = Path('web/src/main.js').read_text()
          lines = {line.strip() for line in src.splitlines()}
          broken = chr(36) + "('.close').forEach(b => b.onclick = closePanels);"
          correct = "document.querySelectorAll('.close').forEach(b => b.onclick = closePanels);"
          if broken in lines:
              raise SystemExit("Bellagio startup regression: single-element selector used before forEach")
          assert correct in lines
          PY

      - name: Build real geospatial terrain
        run: |
          python -m pip install --quiet pillow
          python tools/build_geo_world.py worlds/st-george/geo.json worlds/nice/geo.json

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Build mobile-stable Vegas world
        working-directory: web
        run: |
          npm ci
          OUT_DIR=../_site/worlds/vegas node build.mjs

      - name: Build pinned recovered KONA room runtime
        run: |
          (cd _vendor/konam-final/web && npm ci --ignore-scripts)
          (cd _vendor/konam-final && node tools/build_pages.mjs && node tools/build_app.mjs && bash tools/stage_site.sh)
          test -f _vendor/konam-final/_site/index.html
          grep -q "reviewRoom" _vendor/konam-final/web/src/landing.js
          grep -q "window.__reviewRoomIdentity = REVIEW_ROOM_SEMANTIC_ID" _vendor/konam-final/web/src/landing.js

      - name: Assemble world atlas
        run: |
          mkdir -p _site/worlds/kona _site/worlds/st-george _site/worlds/nice _site/worlds/vegas/assets _site/worlds/vegas/kona-rooms _site/world-runtime
          cp portal/index.html _site/index.html
          cp world-runtime/core.js _site/world-runtime/core.js
          cp world-runtime/places.js _site/world-runtime/places.js
          cp world-runtime/geo-terrain.js _site/world-runtime/geo-terrain.js

          # Vegas: source-built runtime + same-origin assets
          cp -R assets/. _site/worlds/vegas/assets/

          # Final KONA rooms: exact recovery runtime is vendored into this same Pages artifact.
          # This prevents Bellagio from accidentally opening stale production KONA routes.
          cp -R _vendor/konam-final/_site/. _site/worlds/vegas/kona-rooms/

          # Kona: vendor the canonical world into this same deployment artifact.
          cp -R _vendor/studio-kona/preview-v2/. _site/worlds/kona/
          mkdir -p _site/worlds/kona/assets
          cp -R _vendor/studio-kona/web/public/assets/. _site/worlds/kona/assets/
          python tools/patch_kona_world.py

          # St. George and Nice: native race worlds owned by this world repo.
          cp worlds/st-george/index.html _site/worlds/st-george/index.html
          cp -R worlds/st-george/geo _site/worlds/st-george/geo
          cp worlds/nice/index.html _site/worlds/nice/index.html
          cp -R worlds/nice/geo _site/worlds/nice/geo

          cp worlds/registry.json _site/worlds/registry.json
          touch _site/.nojekyll
          test -f _site/index.html
          test -f _site/worlds/vegas/index.html
          test -f _site/worlds/vegas/kona-rooms/index.html
          test -f _site/worlds/vegas/kona-rooms/assets/watches/endurance-pro-study/watch.glb
          test -f _site/worlds/vegas/kona-rooms/assets/rooms/beast-cave/hf-trainer.glb
          test -f _site/worlds/vegas/kona-rooms/assets/rooms/nor3-winter/kona-winter-plate-1024.webp
          test -f _site/worlds/kona/index.html
          test -f _site/worlds/kona/src/islandRuntime.js
          test -f _site/worlds/st-george/index.html
          test -f _site/worlds/nice/index.html
          test -f _site/worlds/st-george/geo/terrain.json
          test -f _site/worlds/st-george/geo/terrain.jpg
          test -f _site/worlds/nice/geo/terrain.json
          test -f _site/worlds/nice/geo/terrain.jpg
          test -f _site/world-runtime/core.js
          test -f _site/world-runtime/places.js
          test -f _site/world-runtime/geo-terrain.js

      # Do not push generated deployment files back to main from inside the Pages job.
      # A self-push triggers the repository's legacy branch-based Pages deployment after
      # this workflow and can overwrite the assembled artifact (including kona-rooms).
      # Generated assets remain deployment artifacts; source updates happen explicitly.

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: validate-build
    steps:
      - name: Let legacy branch Pages finish first
        run: |
          echo "Bellagio still has legacy branch Pages enabled; wait so the assembled artifact is the final deployment."
          sleep 90
      - name: Deploy atlas
        id: deployment
        uses: actions/deploy-pages@v4
