name: Bellagio room hub contract

on:
  pull_request:
    paths:
      - 'worlds/vegas/**'
      - 'web/index.template.html'
      - 'web/src/main.js'
      - 'web/src/places.js'
      - 'portal/index.html'
      - '.github/workflows/pages.yml'
      - 'tests/test_room_hub.py'
      - '.github/workflows/room-hub-contract.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  room-hub:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Validate room-index contracts
        run: |
          python -m unittest tests.test_room_hub -v
          python -m json.tool worlds/vegas/world.json >/dev/null
      - name: Build existing Vegas world with room index
        working-directory: web
        run: |
          npm ci
          OUT_DIR=../_roomhub-build node build.mjs
          test -f ../_roomhub-build/index.html
          grep -q 'id="roomsBtn"' ../_roomhub-build/index.html
          grep -q 'id="roomsPanel"' ../_roomhub-build/index.html
          grep -q 'room:konam:nor3-winter' ../_roomhub-build/index.html
          grep -q 'room:konam:beast-cave' ../_roomhub-build/index.html
          grep -q 'room:konam:breitling-kona' ../_roomhub-build/index.html
      - name: Verify pinned KONA recovery exists
        uses: actions/checkout@v4
        with:
          repository: joaoccaldas/konam
          ref: 68c7b12b597ac3013137c617bf3c6e062c2d6ed9
          path: _vendor/konam-final
      - name: Verify and build exact recovered room runtime
        run: |
          test -f _vendor/konam-final/web/src/nor3-winter.js
          test -f _vendor/konam-final/web/src/beast-cave.js
          test -f _vendor/konam-final/web/src/breitling-kona.js
          test -f _vendor/konam-final/assets/watches/endurance-pro-study/watch.glb
          test -f _vendor/konam-final/assets/rooms/beast-cave/hf-trainer.glb
          test -f _vendor/konam-final/assets/rooms/nor3-winter/kona-winter-plate-1024.webp
          grep -q "window.__reviewRoomIdentity = REVIEW_ROOM_SEMANTIC_ID" _vendor/konam-final/web/src/landing.js
          (cd _vendor/konam-final/web && npm ci --ignore-scripts)
          (cd _vendor/konam-final && node tools/build_pages.mjs && node tools/build_app.mjs && bash tools/stage_site.sh)
          test -f _vendor/konam-final/_site/index.html
          mkdir -p _roomhub-build/kona-rooms
          cp -R _vendor/konam-final/_site/. _roomhub-build/kona-rooms/
          test -f _roomhub-build/kona-rooms/index.html
          test -f _roomhub-build/kona-rooms/assets/watches/endurance-pro-study/watch.glb
