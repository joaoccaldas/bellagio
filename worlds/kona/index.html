<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no,viewport-fit=cover"><meta name="theme-color" content="#071019"><title>Kona · Caldas Worlds</title>
<style>html,body{width:100%;height:100%;margin:0;overflow:hidden;background:#071019}*{box-sizing:border-box}#c{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}.top{position:fixed;z-index:5;top:max(10px,env(safe-area-inset-top));left:10px;right:10px;display:flex;justify-content:space-between;pointer-events:none}.top a,.top span{pointer-events:auto;color:white;text-decoration:none;background:rgba(7,16,25,.78);border:1px solid rgba(255,255,255,.15);border-radius:999px;padding:9px 12px;font:12px system-ui;backdrop-filter:blur(10px)}#loading{position:fixed;inset:0;display:grid;place-items:center;color:#d9e3e8;font:600 12px system-ui;letter-spacing:.14em;text-transform:uppercase}</style></head>
<body><canvas id="c"></canvas><div id="loading">Loading Hawaiʻi Island</div><div class="top"><span></span><span>Kona · Hawaiʻi</span></div>
<script type="importmap">{"imports":{"three":"https://esm.sh/three@0.160.0","three/":"https://esm.sh/three@0.160.0/","three-mesh-bvh":"https://esm.sh/three-mesh-bvh@0.7.8?external=three"}}</script>
<script>window.__KONA_ASSET_BASE='https://joaoccaldas.github.io/studio-kona/web/public/assets/';</script>
<script type="module">
import { installWorldNav, markWorldReady } from '../../world-runtime/core.js';
import { installPlacesPanel } from '../../world-runtime/places.js';
installWorldNav({ href: '../../' });

const KONA_PLACES = [
  ['island','Whole island','Big Island aerial overview'],
  ['pier','Kailua Pier','Race-week waterfront and swim start'],
  ['finish_chute','Finish chute','Aliʻi Drive finish area'],
  ['kona_inn','Kona Inn','Historic oceanfront village'],
  ['huggos',"Huggo's",'Oceanfront dining area'],
  ['bikeworks','Bike Works','Bike service and athlete hub'],
  ['palani_climb','Palani climb','The hot corner and climb'],
  ['kta_kona','KTA Kona','Athlete grocery stop'],
  ['old_airport','Old Airport','Open coastal recreation area'],
  ['airport','KOA airport','Kona International Airport'],
  ['hawi','Hawi','Northern turnaround region'],
  ['energylab','Energy Lab','Iconic Queen K race section'],
  ['waikoloa','Waikoloa','Resort and race corridor'],
  ['kawaihae','Kawaihae','Harbor and north-coast corridor'],
  ['waimea','Waimea','Upland town and green interior'],
  ['hilo','Hilo','Windward Big Island'],
  ['kahaluu','Kahaluʻu','South Kona coastal area'],
  ['southkona','South Kona','Southern Kona district']
].map(([id,label,description])=>({id,label,description}));

import('https://joaoccaldas.github.io/studio-kona/preview-v2/src/islandRuntime.js')
  .then(() => {
    const ready = () => {
      if (!window.__kona?.ready) return setTimeout(ready, 80);
      installPlacesPanel({
        title: 'Kona places',
        places: KONA_PLACES,
        initial: 'island',
        onSelect: place => window.__kona.goTo(place.id, { animate: true })
      });
      markWorldReady({ id: 'kona', detail: { kind: 'full-island', source: 'remote-fallback', places: KONA_PLACES.length } });
    };
    ready();
  })
  .catch(error => {
    console.error('Kona fallback failed to load', error);
    document.documentElement.dataset.worldError = 'true';
  });
</script></body></html>
