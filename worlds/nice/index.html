<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#07151d">
<title>Nice · Caldas Worlds</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#07151d;color:#fff;font-family:Inter,system-ui,sans-serif}
*{box-sizing:border-box}canvas{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
.caption{position:fixed;z-index:4;left:16px;right:16px;bottom:max(18px,env(safe-area-inset-bottom));max-width:620px;pointer-events:none;text-shadow:0 2px 18px #000}
.caption h1{font-size:clamp(28px,7vw,52px);margin:0 0 5px;line-height:.95}.caption p{margin:0;color:#d9e9ef;font-size:12px;line-height:1.42}.hint{margin-top:7px;font-size:10px;color:#9fc7d1}.attr{margin-top:5px;font-size:9px;color:#a9c6ce}
</style>
</head>
<body>
<canvas id="c" aria-label="Interactive Nice World Championship 3D world"></canvas>
<div class="caption"><h1 id="placeTitle">Nice</h1><p id="placeText">World Championship geography from Plage des Ponchettes and the Promenade des Anglais into the Alpes-Maritimes.</p><div class="hint">Drag to orbit · pinch / wheel to zoom · Places to travel</div><div class="attr">Imagery: Esri World Imagery · Elevation: AWS Terrarium</div></div>
<script type="importmap">{"imports":{"three":"https://esm.sh/three@0.160.0","three/":"https://esm.sh/three@0.160.0/"}}</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/examples/jsm/controls/OrbitControls.js';
import { detectDevice, installWorldNav, installResize, createFrameLoop, markWorldReady } from '../../world-runtime/core.js';
import { installPlacesPanel, flyCamera } from '../../world-runtime/places.js';
import { loadGeoTerrain, localMeters } from '../../world-runtime/geo-terrain.js';

const {coarse}=detectDevice();
const renderer=new THREE.WebGLRenderer({canvas:document.querySelector('#c'),antialias:!coarse,powerPreference:'high-performance'});
renderer.outputColorSpace=THREE.SRGBColorSpace;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.03;
const scene=new THREE.Scene();scene.background=new THREE.Color(0xa9ced8);scene.fog=new THREE.FogExp2(0xc7dfe5,.000035);
const camera=new THREE.PerspectiveCamera(48,1,2,150000);
const controls=new OrbitControls(camera,renderer.domElement);controls.enableDamping=true;controls.dampingFactor=.06;controls.minDistance=25;controls.maxDistance=85000;controls.maxPolarAngle=Math.PI*.495;controls.screenSpacePanning=true;controls.zoomSpeed=.9;controls.panSpeed=.7;
controls.touches.ONE=THREE.TOUCH.ROTATE;controls.touches.TWO=THREE.TOUCH.DOLLY_PAN;
scene.add(new THREE.HemisphereLight(0xe9f8ff,0x4a4d3c,1.65));
const sun=new THREE.DirectionalLight(0xfff1d4,4.1);sun.position.set(-25000,42000,19000);scene.add(sun);

const P={
 ponchettes:{label:'Plage des Ponchettes',description:'Swim start / Baie des Anges',lat:43.6946665,lon:7.2748312},
 promenade:{label:'Promenade des Anglais',description:'Race center and finish corridor',lat:43.6949,lon:7.2660},
 negresco:{label:'Hôtel Negresco',description:'Run-course landmark',lat:43.694444,lon:7.2575},
 massena:{label:'Place Masséna / Vieux Nice',description:'Central Nice race-week area',lat:43.69705,lon:7.27026},
 airport:{label:'Nice Airport',description:'Western Promenade turnaround area',lat:43.6584,lon:7.2159},
 vence:{label:'Vence',description:'Inland bike-course town',lat:43.722465,lon:7.111862},
 gourdon:{label:'Gourdon',description:'Perched climbing village',lat:43.72111,lon:6.97917},
 andon:{label:'Andon',description:'High inland course village',lat:43.7742,lon:6.7872},
 greolieres:{label:'Gréolières',description:'Technical mountain section',lat:43.79667,lon:6.94417}
};
let geo=null,cancelFlight=null;

function marker(pos,color=0x29b8e6,height=130){
 const g=new THREE.Group();g.position.copy(pos);
 const beam=new THREE.Mesh(new THREE.CylinderGeometry(7,7,height,10),new THREE.MeshBasicMaterial({color,transparent:true,opacity:.38,depthWrite:false}));
 beam.position.y=height/2;g.add(beam);
 const ring=new THREE.Mesh(new THREE.TorusGeometry(42,5,8,28),new THREE.MeshBasicMaterial({color,toneMapped:false}));
 ring.rotation.x=Math.PI/2;ring.position.y=4;g.add(ring);scene.add(g);return g;
}
function boxAt(lat,lon,w,h,d,mat,y=0){
 const p=geo.toWorld(lat,lon,y),m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),mat);m.position.copy(p);m.position.y+=h/2;scene.add(m);return m;
}
function routeLine(keys,color=0x183b55){
 const pts=keys.map(k=>geo.toWorld(P[k].lat,P[k].lon,18));
 const curve=new THREE.CatmullRomCurve3(pts);
 const tube=new THREE.Mesh(new THREE.TubeGeometry(curve,120,7,6,false),new THREE.MeshBasicMaterial({color,transparent:true,opacity:.72,toneMapped:false}));
 scene.add(tube);
}
function destinationView(id){
 if(id==='overview') return {pos:new THREE.Vector3(5000,33000,34000),target:new THREE.Vector3(0,600,0),title:'Nice',text:'Real satellite terrain from the Côte d’Azur into Vence, Gourdon, Andon and Gréolières.'};
 const p=P[id],t=geo.toWorld(p.lat,p.lon,24);
 const close=['ponchettes','promenade','negresco','massena','airport'].includes(id);
 const offset=close?new THREE.Vector3(600,420,600):new THREE.Vector3(1800,1200,1800);
 return {pos:t.clone().add(offset),target:t,title:p.label,text:p.description};
}
function goto(id){
 const v=destinationView(id);cancelFlight?.();cancelFlight=flyCamera({camera,controls,toPosition:v.pos,toTarget:v.target,duration:id==='overview'?1.5:1.25});
 document.querySelector('#placeTitle').textContent=v.title;document.querySelector('#placeText').textContent=v.text;
}

async function init(){
 installWorldNav({href:'../../'});
 try{geo=await loadGeoTerrain(THREE,scene,{base:'./geo/',segments:coarse?96:128});}
 catch(e){
   console.error('Real terrain unavailable, using fallback',e);
   const plane=new THREE.Mesh(new THREE.PlaneGeometry(60000,40000,20,20),new THREE.MeshStandardMaterial({color:0x78939b,roughness:1}));plane.rotation.x=-Math.PI/2;scene.add(plane);
   const center={lat:43.75,lon:7.05};
   geo={toWorld:(lat,lon,y=0)=>{const [x,n]=localMeters(lat,lon,center);return new THREE.Vector3(x,y,-n)}};
 }
 const white=new THREE.MeshStandardMaterial({color:0xf1eee8,roughness:.8}),red=new THREE.MeshStandardMaterial({color:0xa84c45,roughness:.8}),dark=new THREE.MeshStandardMaterial({color:0x202224,roughness:.88}),blue=new THREE.MeshStandardMaterial({color:0x2456a6,roughness:.68}),gold=new THREE.MeshStandardMaterial({color:0xc99b43,roughness:.45,metalness:.3});
 for(const [id,p] of Object.entries(P)) marker(geo.toWorld(p.lat,p.lon,5),id==='gourdon'||id==='andon'||id==='greolieres'?0xf6c85f:0x2fc0e8,id==='greolieres'?180:120);
 // Nice race-center detail
 boxAt(P.ponchettes.lat,P.ponchettes.lon,90,3,24,dark,1);
 for(let i=0;i<18;i++) boxAt(P.promenade.lat,P.promenade.lon+i*0.000025,3,2,22,blue,2);
 // Negresco massing + dome
 boxAt(P.negresco.lat,P.negresco.lon,85,38,48,white,1);
 const np=geo.toWorld(P.negresco.lat,P.negresco.lon,41);
 const dome=new THREE.Mesh(new THREE.SphereGeometry(18,20,10,0,Math.PI*2,0,Math.PI/2),red);dome.position.copy(np);scene.add(dome);
 const cap=new THREE.Mesh(new THREE.CylinderGeometry(3,3,12,14),gold);cap.position.copy(np).add(new THREE.Vector3(0,19,0));scene.add(cap);
 boxAt(P.massena.lat,P.massena.lon,90,2,70,new THREE.MeshStandardMaterial({color:0xc8b7a1,roughness:.9}),1);
 boxAt(P.airport.lat,P.airport.lon,260,28,115,white,1);
 routeLine(['ponchettes','promenade','airport'],0x165f83);
 routeLine(['promenade','vence','gourdon','andon','greolieres'],0x263947);
 const places=[{id:'overview',label:'Whole Nice world',description:'Coast + Alpes-Maritimes'},...Object.entries(P).map(([id,p])=>({id,label:p.label,description:p.description}))];
 installPlacesPanel({title:'Nice places',places,initial:'overview',onSelect:p=>goto(p.id)});
 goto('overview');
 markWorldReady({id:'nice',detail:{kind:'geo-race-world',places:places.length}});
}
installResize({renderer,camera,quality:()=>coarse?'balanced':'high'});
createFrameLoop(()=>{controls.update();renderer.render(scene,camera)});
init();
</script>
</body>
</html>
