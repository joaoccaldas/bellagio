<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#07151d">
<title>Nice · Caldas Worlds</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#07151d;color:#fff;font-family:Inter,system-ui,sans-serif}
*{box-sizing:border-box}canvas{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
.caption{position:fixed;z-index:4;left:16px;right:16px;bottom:max(18px,env(safe-area-inset-bottom));max-width:590px;pointer-events:none;text-shadow:0 2px 20px #000}
.caption h1{font-size:clamp(28px,7vw,52px);margin:0 0 5px;line-height:.95}.caption p{margin:0;color:#d7e6eb;font-size:12px;line-height:1.42}.hint{margin-top:7px;font-size:10px;color:#9fc5cf}
</style>
</head>
<body>
<canvas id="c" aria-label="Interactive Nice France 3D world"></canvas>
<div class="caption"><h1 id="placeTitle">Nice</h1><p id="placeText">Mediterranean race world from Plage des Ponchettes along the Promenade des Anglais and into the Alpes-Maritimes hinterland.</p><div class="hint">Drag to orbit · pinch / wheel to zoom · Places to travel</div></div>
<script type="importmap">{"imports":{"three":"https://esm.sh/three@0.160.0","three/":"https://esm.sh/three@0.160.0/"}}</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/examples/jsm/controls/OrbitControls.js';
import { detectDevice, installWorldNav, installResize, createFrameLoop, markWorldReady } from '../../world-runtime/core.js';
import { installPlacesPanel, flyCamera } from '../../world-runtime/places.js';

const { coarse, reducedMotion }=detectDevice();
const canvas=document.querySelector('#c');
const renderer=new THREE.WebGLRenderer({canvas,antialias:!coarse,powerPreference:'high-performance'});
renderer.outputColorSpace=THREE.SRGBColorSpace;
renderer.toneMapping=THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure=1.06;

const scene=new THREE.Scene();
scene.background=new THREE.Color(0x83b7c7);
scene.fog=new THREE.FogExp2(0xb8d7df,.0025);

const camera=new THREE.PerspectiveCamera(48,1,.1,2200);
camera.position.set(110,75,125);
const controls=new OrbitControls(camera,canvas);
controls.enableDamping=true;controls.dampingFactor=.065;controls.target.set(0,5,0);
controls.minDistance=2;controls.maxDistance=420;controls.maxPolarAngle=Math.PI*.495;
controls.screenSpacePanning=true;controls.zoomSpeed=1;controls.panSpeed=.75;controls.rotateSpeed=.55;
controls.touches.ONE=THREE.TOUCH.ROTATE;controls.touches.TWO=THREE.TOUCH.DOLLY_PAN;

scene.add(new THREE.HemisphereLight(0xdff4ff,0x5e4939,1.7));
const sun=new THREE.DirectionalLight(0xfff1d5,4.3);sun.position.set(-80,130,60);scene.add(sun);

const MAT={
 sea:new THREE.MeshPhysicalMaterial({color:0x147b9f,roughness:.18,transparent:true,opacity:.88}),
 beach:new THREE.MeshStandardMaterial({color:0xb4aaa0,roughness:1}),
 road:new THREE.MeshStandardMaterial({color:0x303234,roughness:.98}),
 promenade:new THREE.MeshStandardMaterial({color:0xb8b1a7,roughness:.92}),
 white:new THREE.MeshStandardMaterial({color:0xeee8df,roughness:.82}),
 ochre:new THREE.MeshStandardMaterial({color:0xd8ad73,roughness:.84}),
 red:new THREE.MeshStandardMaterial({color:0xa94a3e,roughness:.82}),
 roof:new THREE.MeshStandardMaterial({color:0x795448,roughness:.88}),
 green:new THREE.MeshStandardMaterial({color:0x476b49,roughness:.96}),
 mountain:new THREE.MeshStandardMaterial({color:0x6d705e,roughness:.98}),
 rock:new THREE.MeshStandardMaterial({color:0x8b806c,roughness:1}),
 blue:new THREE.MeshStandardMaterial({color:0x2957a5,roughness:.7}),
 dark:new THREE.MeshStandardMaterial({color:0x171b1d,roughness:.75}),
 gold:new THREE.MeshStandardMaterial({color:0xc8983f,roughness:.45,metalness:.35})
};

function box(x,y,z,w,h,d,mat,name=''){const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),mat);m.position.set(x,y+h/2,z);m.name=name;scene.add(m);return m}
function cyl(x,y,z,r,h,mat,seg=16){const m=new THREE.Mesh(new THREE.CylinderGeometry(r,r,h,seg),mat);m.position.set(x,y+h/2,z);scene.add(m);return m}
function road(points,width=2.4,mat=MAT.road){
 const curve=new THREE.CatmullRomCurve3(points.map(([x,z])=>new THREE.Vector3(x,.16,z)));
 const geo=new THREE.TubeGeometry(curve,Math.max(30,points.length*14),width,6,false);
 const m=new THREE.Mesh(geo,mat);m.scale.y=.055;scene.add(m);return m
}
function ridge(x,z,r=18,h=20){
 const m=new THREE.Mesh(new THREE.CylinderGeometry(r*.55,r,h,14,4),MAT.mountain);
 m.position.set(x,h/2,z);m.rotation.y=(x+z)*.02;scene.add(m);return m
}

// Mediterranean and shoreline
const sea=new THREE.Mesh(new THREE.PlaneGeometry(700,360,40,20),MAT.sea);sea.rotation.x=-Math.PI/2;sea.position.set(0,-.5,-125);scene.add(sea);
const beach=new THREE.Mesh(new THREE.PlaneGeometry(320,18),MAT.beach);beach.rotation.x=-Math.PI/2;beach.position.set(0,.05,-16);scene.add(beach);
const prom=new THREE.Mesh(new THREE.PlaneGeometry(320,13),MAT.promenade);prom.rotation.x=-Math.PI/2;prom.position.set(0,.11,-3);scene.add(prom);
road([[-150,4],[-110,2],[-65,1],[-20,0],[25,0],[70,1],[120,3],[155,4]],3.4);

// Sea-facing city blocks
for(let x=-135;x<=125;x+=12){
 const depth=10+(Math.abs(x*13)%8), h=8+(Math.abs(x*17)%13);
 const mat=(Math.abs(x)%24===0)?MAT.ochre:MAT.white;
 box(x,.1,13,9,h,depth,mat,'nice_block');
 box(x,h+.1,13,9.5,.65,depth+.4,MAT.roof);
}

// Hotel Negresco
box(-18,.1,10,20,14,13,MAT.white,'hotel_negresco');
box(-18,14.1,10,20,1.1,13,MAT.red);
cyl(-18,15.2,10,4.5,4.2,MAT.red,28);
cyl(-18,19.4,10,.7,2.3,MAT.gold,18);

// Place Massena / Old Nice hint
box(44,.1,29,20,.35,18,MAT.promenade,'place_massena');
for(let i=0;i<8;i++){const x=35+(i%4)*6,z=23+Math.floor(i/4)*8;box(x,.1,z,4,8+(i%3)*2,5,i%2?MAT.red:MAT.ochre)}
// blue chairs / beach clubs
for(let x=-70;x<=70;x+=14){box(x,.22,-8,1.3,.8,1.5,MAT.blue,'chaise_bleue')}
for(let x=-120;x<=100;x+=22){box(x,.1,-15,10,.2,4,MAT.white,'beach_club')}

// Ponchettes start / transition
box(67,.1,-9,16,.25,5,MAT.dark,'ponchettes_start');
box(56,.1,-1,24,.25,7,MAT.blue,'transition');
for(let i=0;i<10;i++)box(47+i*2,.4,-1,.08,1.2,5,MAT.dark,'bike_rack');

// Airport at west end
box(-142,.1,18,44,3.5,22,MAT.white,'nice_airport');
box(-142,3.7,18,44,.4,22,MAT.dark);
for(let i=0;i<3;i++)box(-158+i*14,.1,5,10,.15,35,MAT.road,'runway');

// Inland terrain and villages
[
 [20,85,24,18],[42,102,20,24],[65,118,25,30],[89,140,30,38],
 [108,165,24,32],[127,187,28,42],[-5,105,24,24],[-25,137,30,36],
 [15,175,35,44],[55,205,38,55]
].forEach(v=>ridge(...v));

function village(x,z,name,color=MAT.ochre){
 for(let i=0;i<10;i++){
   const a=i/10*Math.PI*2,r=5+(i%3)*2;
   box(x+Math.cos(a)*r,.2,z+Math.sin(a)*r,3.2,3+(i%4)*1.6,3.2,i%2?color:MAT.white,name);
 }
 cyl(x,.2,z,1.5,7,MAT.white,12);cyl(x,7.2,z,2.1,1.6,MAT.roof,12);
}
village(28,87,'vence');village(68,137,'gourdon',MAT.ochre);village(88,183,'andon',MAT.white);village(42,210,'greolieres',MAT.ochre);

// Bike-course ribbon inland
road([[55,0],[43,35],[31,63],[28,87],[46,112],[68,137],[82,160],[88,183],[70,196],[42,210]],1.8,MAT.dark);

// Col / mountain hints
ridge(92,120,18,45);ridge(112,150,22,60);ridge(70,215,32,70);

const views={
 overview:{pos:[125,92,150],target:[10,8,55],title:'Nice',text:'Mediterranean race world from Plage des Ponchettes to the inland villages of the Alpes-Maritimes.'},
 ponchettes:{pos:[86,16,-28],target:[62,2,-6],title:'Plage des Ponchettes / start',text:'Swim start on the pebble beach at Baie des Anges.'},
 promenade:{pos:[12,12,-30],target:[0,3,2],title:'Promenade des Anglais',text:'The race epicenter, bike park, run course and finish corridor.'},
 negresco:{pos:[4,10,-5],target:[-18,8,10],title:'Hôtel Negresco',text:'The landmark hotel beside the World Championship run course.'},
 massena:{pos:[68,18,48],target:[44,5,28],title:'Place Masséna / Vieux Nice',text:'Central Nice race-week area immediately inland from the Promenade.'},
 airport:{pos:[-105,18,-12],target:[-142,3,15],title:'Nice Airport',text:'Western Promenade turnaround area.'},
 vence:{pos:[50,35,63],target:[28,6,87],title:'Vence',text:'Historic inland village on the World Championship bike route.'},
 gourdon:{pos:[93,47,108],target:[68,8,137],title:'Gourdon',text:'Perched village in the climbing phase of the bike course.'},
 andon:{pos:[115,52,155],target:[88,8,183],title:'Andon',text:'Mountain village on the high inland section.'},
 greolieres:{pos:[72,62,180],target:[42,9,210],title:'Gréolières',text:'Technical mountain landscape and dramatic descent country.'}
};
const places=[
 {id:'overview',label:'Whole world',description:'Nice coast + hinterland'},
 {id:'ponchettes',label:'Plage des Ponchettes',description:'Swim start / Baie des Anges'},
 {id:'promenade',label:'Promenade des Anglais',description:'Race center and finish'},
 {id:'negresco',label:'Hôtel Negresco',description:'Run-course landmark'},
 {id:'massena',label:'Place Masséna / Vieux Nice',description:'Central Nice'},
 {id:'airport',label:'Nice Airport',description:'Promenade turnaround'},
 {id:'vence',label:'Vence',description:'Inland bike route'},
 {id:'gourdon',label:'Gourdon',description:'Perched climbing village'},
 {id:'andon',label:'Andon',description:'High mountain village'},
 {id:'greolieres',label:'Gréolières',description:'Technical mountain section'}
];

let cancelFlight=null;
function goto(id){
 const v=views[id]||views.overview;
 cancelFlight?.();
 cancelFlight=flyCamera({camera,controls,toPosition:new THREE.Vector3(...v.pos),toTarget:new THREE.Vector3(...v.target),duration:id==='overview'?1.4:1.15});
 document.querySelector('#placeTitle').textContent=v.title;
 document.querySelector('#placeText').textContent=v.text;
}

installWorldNav({href:'../../'});
installPlacesPanel({title:'Nice places',places,initial:'overview',onSelect:p=>goto(p.id)});
installResize({renderer,camera,quality:()=>coarse?'balanced':'high'});
createFrameLoop((dt,t)=>{if(!reducedMotion)sea.material.opacity=.84+.035*Math.sin(t*.45);controls.update();renderer.render(scene,camera)});
markWorldReady({id:'nice',detail:{kind:'multi-location-world',places:places.length}});
</script>
</body>
</html>
