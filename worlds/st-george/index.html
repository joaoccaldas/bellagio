<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#170d09">
<title>St. George 2022 · Caldas Worlds</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#170d09;color:#fff;font-family:Inter,system-ui,sans-serif}
*{box-sizing:border-box}canvas{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
.caption{position:fixed;z-index:4;left:16px;right:16px;bottom:max(18px,env(safe-area-inset-bottom));max-width:620px;pointer-events:none;text-shadow:0 2px 18px #000}
.caption h1{font-size:clamp(28px,7vw,52px);margin:0 0 5px;line-height:.95}.caption p{margin:0;color:#ead0bc;font-size:12px;line-height:1.42}.hint{margin-top:7px;font-size:10px;color:#d7a780}.attr{margin-top:5px;font-size:9px;color:#c49b82}
</style>
</head>
<body>
<canvas id="c" aria-label="Interactive St. George 2022 World Championship 3D world"></canvas>
<div class="caption"><h1 id="placeTitle">St. George · 2022</h1><p id="placeText">IRONMAN 70.3 World Championship · October 28–29, 2022.</p><div class="hint">Drag to orbit · pinch / wheel to zoom · Places to travel</div><div class="attr">Imagery: Esri World Imagery · Elevation: AWS Terrarium</div></div>
<script type="importmap">{"imports":{"three":"https://esm.sh/three@0.160.0","three/":"https://esm.sh/three@0.160.0/"}}</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/examples/jsm/controls/OrbitControls.js';
import { detectDevice, installWorldNav, installResize, createFrameLoop, markWorldReady } from '../../world-runtime/core.js';
import { installPlacesPanel, flyCamera } from '../../world-runtime/places.js';
import { loadGeoTerrain, localMeters } from '../../world-runtime/geo-terrain.js';

const {coarse}=detectDevice();
const renderer=new THREE.WebGLRenderer({canvas:document.querySelector('#c'),antialias:!coarse,powerPreference:'high-performance'});
renderer.outputColorSpace=THREE.SRGBColorSpace;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.05;
const scene=new THREE.Scene();scene.background=new THREE.Color(0xb98361);scene.fog=new THREE.FogExp2(0xc08f70,.00004);
const camera=new THREE.PerspectiveCamera(48,1,2,120000);
const controls=new OrbitControls(camera,renderer.domElement);controls.enableDamping=true;controls.dampingFactor=.06;controls.minDistance=25;controls.maxDistance=65000;controls.maxPolarAngle=Math.PI*.495;controls.screenSpacePanning=true;controls.zoomSpeed=.9;controls.panSpeed=.7;
controls.touches.ONE=THREE.TOUCH.ROTATE;controls.touches.TWO=THREE.TOUCH.DOLLY_PAN;
scene.add(new THREE.HemisphereLight(0xffdfc2,0x4a2015,1.7));
const sun=new THREE.DirectionalLight(0xffc487,4.0);sun.position.set(-22000,38000,17000);scene.add(sun);

const P={
 sand_hollow:{label:'Sand Hollow / T1',description:'Swim start and Transition 1',lat:37.12056,lon:-113.38528},
 snow_canyon:{label:'Snow Canyon',description:'Signature red-rock bike corridor',lat:37.20306,lon:-113.64},
 red_hills:{label:'Red Hills',description:'Red Hills Parkway / run terrain',lat:37.11406,lon:-113.57471},
 town_square:{label:'Town Square Park / finish',description:'IRONMAN Village and finish',lat:37.1074,lon:-113.58492},
 t2:{label:'Tabernacle St / 100W · T2',description:'2022 Transition 2',lat:37.1078,lon:-113.5837},
 convention:{label:'Dixie Convention Center',description:'Race-week ceremonies',lat:37.07712,lon:-113.5824}
};
let geo=null,cancelFlight=null;

function marker(pos,color=0xff6a2a,height=110){
 const g=new THREE.Group();g.position.copy(pos);
 const beam=new THREE.Mesh(new THREE.CylinderGeometry(7,7,height,10),new THREE.MeshBasicMaterial({color,transparent:true,opacity:.45,depthWrite:false}));
 beam.position.y=height/2;g.add(beam);
 const ring=new THREE.Mesh(new THREE.TorusGeometry(40,5,8,28),new THREE.MeshBasicMaterial({color,toneMapped:false}));
 ring.rotation.x=Math.PI/2;ring.position.y=4;g.add(ring);scene.add(g);return g;
}
function boxAt(lat,lon,w,h,d,mat,y=0){
 const p=geo.toWorld(lat,lon,y),m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),mat);m.position.copy(p);m.position.y+=h/2;scene.add(m);return m;
}
function archAt(lat,lon){
 const mat=new THREE.MeshStandardMaterial({color:0x111111,roughness:.8}),white=new THREE.MeshStandardMaterial({color:0xf2eee8,roughness:.7});
 const p=geo.toWorld(lat,lon,3);
 for(const dx of [-18,18]){const m=new THREE.Mesh(new THREE.BoxGeometry(3,32,3),mat);m.position.copy(p).add(new THREE.Vector3(dx,16,0));scene.add(m)}
 const top=new THREE.Mesh(new THREE.BoxGeometry(39,4,4),white);top.position.copy(p).add(new THREE.Vector3(0,31,0));scene.add(top);
}
function routeLine(keys,color=0xff532c){
 const pts=keys.map(k=>geo.toWorld(P[k].lat,P[k].lon,16));
 const curve=new THREE.CatmullRomCurve3(pts);
 const tube=new THREE.Mesh(new THREE.TubeGeometry(curve,80,7,6,false),new THREE.MeshBasicMaterial({color,transparent:true,opacity:.72,toneMapped:false}));
 scene.add(tube);
}
function destinationView(id){
 if(id==='overview') return {pos:new THREE.Vector3(0,26000,26000),target:new THREE.Vector3(0,500,0),title:'St. George · Oct 28–29, 2022',text:'Real satellite terrain covering Sand Hollow, downtown St. George, Red Hills and Snow Canyon.'};
 const p=P[id],t=geo.toWorld(p.lat,p.lon,20);
 const close=['town_square','t2','convention'].includes(id);
 const offset=close?new THREE.Vector3(500,360,500):new THREE.Vector3(1700,1100,1700);
 return {pos:t.clone().add(offset),target:t,title:p.label,text:p.description};
}
function goto(id){
 const v=destinationView(id);cancelFlight?.();cancelFlight=flyCamera({camera,controls,toPosition:v.pos,toTarget:v.target,duration:id==='overview'?1.5:1.25});
 document.querySelector('#placeTitle').textContent=v.title;document.querySelector('#placeText').textContent=v.text;
}

async function init(){
 installWorldNav({href:'../../'});
 try{geo=await loadGeoTerrain(THREE,scene,{base:'./geo/',segments:coarse?96:128});}
 catch(e){
   console.error('Real terrain unavailable, using fallback',e);
   const plane=new THREE.Mesh(new THREE.PlaneGeometry(40000,40000,20,20),new THREE.MeshStandardMaterial({color:0x7b3321,roughness:1}));plane.rotation.x=-Math.PI/2;scene.add(plane);
   const center={lat:37.13,lon:-113.53};
   geo={toWorld:(lat,lon,y=0)=>{const [x,n]=localMeters(lat,lon,center);return new THREE.Vector3(x,y,-n)}};
 }
 const red=new THREE.MeshStandardMaterial({color:0xb04d31,roughness:.9}),sand=new THREE.MeshStandardMaterial({color:0xe2d4c3,roughness:.86}),dark=new THREE.MeshStandardMaterial({color:0x262321,roughness:.9}),green=new THREE.MeshStandardMaterial({color:0x637b43,roughness:.95});
 for(const [id,p] of Object.entries(P)) marker(geo.toWorld(p.lat,p.lon,4),id==='snow_canyon'?0xff9a58:0xff5d2a,id==='snow_canyon'?160:100);
 // 2022 venue detail
 archAt(P.town_square.lat,P.town_square.lon);
 boxAt(P.t2.lat,P.t2.lon,52,22,35,red,1);
 boxAt(P.convention.lat,P.convention.lon,150,34,90,sand,1);
 boxAt(P.town_square.lat+0.00018,P.town_square.lon+0.00018,95,1.5,72,green,1);
 for(let i=0;i<16;i++) boxAt(P.sand_hollow.lat+(i%8)*0.000035,P.sand_hollow.lon+Math.floor(i/8)*0.00007,4,3,24,dark,2);
 routeLine(['sand_hollow','town_square','red_hills','snow_canyon'],0xff4d21);
 const places=[{id:'overview',label:'Whole 2022 world',description:'Championship geography'},...Object.entries(P).map(([id,p])=>({id,label:p.label,description:p.description}))];
 installPlacesPanel({title:'St. George 2022 places',places,initial:'overview',onSelect:p=>goto(p.id)});
 goto('overview');
 markWorldReady({id:'st-george',detail:{kind:'geo-race-world',era:'2022-10-28/29',places:places.length}});
}
installResize({renderer,camera,quality:()=>coarse?'balanced':'high'});
createFrameLoop(()=>{controls.update();renderer.render(scene,camera)});
init();
</script>
</body>
</html>
